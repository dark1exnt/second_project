name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.8
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blog_marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d blog_marketplace"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      PYTHONPATH: src
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blog_marketplace
      SECRET_KEY: test-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      APP_ENV: test
      APP_DEBUG: false

      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_NAME: blog-images
      S3_REGION: eu-west-1

      RABBITMQ_HOST: localhost
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest

      SMTP_HOST: smtp.example.com
      SMTP_PORT: 587
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      EMAILS_FROM_EMAIL: noreply@example.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run Ruff check
        run: poetry run ruff check src

      - name: Run Ruff format check
        run: poetry run ruff format --check src

      - name: Run mypy
        run: poetry run mypy src

      - name: Run Bandit
        run: poetry run bandit -r src -lll -x .venv,venv,build,dist,migrations

      - name: Run Radon CC
        run: |
          poetry run radon cc -s -a src
          if poetry run radon cc -s src | grep -E ' - [EF]$ '; then
            echo "Radon CC failed: found E/F complexity"
            exit 1
          fi

      - name: Run Radon MI
        run: |
          poetry run radon mi src
          if poetry run radon mi src \
            | grep -oE '\([0-9]+\.[0-9]+\)' \
            | tr -d '()' \
            | awk '$1+0 < 65 {exit 1}'; then
            echo "Radon MI passed"
          else
            echo "Radon MI failed: found MI < 65"
            exit 1
          fi

      - name: Apply migrations
        run: poetry run alembic upgrade head

      - name: Run tests
        run: poetry run pytest tests/ -v